name: PyTest

on:
  pull_request:
    branch: master
    paths:
      - '**.py'
      - '**/pytest.yaml'
      - 'pyproject.toml'
      - 'poetry.lock'
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        pyversion: [ "3.10", "3.11", "3.12", "3.13" ]
        include:
        - os: ubuntu-latest
          path: ~/.cache/pip
        - os: macos-latest
          path: ~/Library/Caches/pip
        - os: windows-latest
          path: ~\AppData\Local\pip\Cache
        exclude:
        # gh runner throws "Error: Version ${{ matrix.pyversion }} with arch arm64 not found"
        - os: macos-latest
          pyversion: "3.8"
        - os: macos-latest
          pyversion: "3.9"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4.1.4
        with:
          persist-credentials: false

      - name: Setup Python (faster than using Python container)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyversion }}

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local  # the path depends on the OS
          key: poetry-${{ runner.os }}-${{ matrix.pyversion }}-0  # increment to reset cache
          
      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true' && matrix.pyversion != '3.8'
        uses: snok/install-poetry@v1

      - name: Install Poetry (Python3.8)
        if: steps.cached-poetry.outputs.cache-hit != 'true' &&  matrix.pyversion == '3.8'
        uses: snok/install-poetry@v1
        with:
          version: "1.8.5" 

      - name: Update Lockfile (Python3.8)
        if: matrix.pyversion == '3.8'
        run: poetry lock
        shell: bash

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Create Anvil CMD shim on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $anvil = (Get-Command anvil).Source
          $shimDir = Join-Path $env:RUNNER_TEMP 'anvil-shim'
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          $shimPath = Join-Path $shimDir 'anvil.cmd'
          ('"{0}" %*' -f $anvil) | Set-Content -Encoding ASCII -Path $shimPath
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
      - name: Install Dependencies
        run: poetry install
        shell: bash
        
      - name: Install Setuptools for `pkg_resources` so web3.py works
        run: poetry run pip install -U setuptools
        shell: bash
      
      - name: Setup brownie networks
        run: |
          poetry run brownie networks modify mainnet host=${{ secrets.WEB3_PROVIDER }}
        shell: bash
        continue-on-error: true

      - name: Install Multicall
        run: poetry run python -m pip install .
        shell: bash

      - name: Run test suite
        env:
          PYTEST_NETWORK: mainnet
          ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN  }}
          GAS_LIMIT: 5000000
        run: poetry run pytest
        shell: bash
